name: Check public calculator

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/check-pages.yml'
      - 'index.html'
      - 'home.html'
      - 'industry.html'
      - 'roof.js'
      - 'roof.css'
      - 'geometry.js'
      - 'methodology.*'
      - 'app.js'
      - 'calculator-template.js'
      - 'providers.js'
      - 'solar.js'
      - 'style.css'
      - 'data/nasa-power-climatology.json'

permissions:
  contents: read

concurrency:
  group: calculator-smoke
  cancel-in-progress: true

env:
  SITE_URL: https://mikhail228777.github.io/solar-calculator-delta-500/

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Pages serves both calculators and the examples return expected values
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { setTimeout } from 'node:timers/promises';

          const site = new URL(process.env.SITE_URL);
          const commit = process.env.GITHUB_SHA;
          const files = ['index.html', 'home.html', 'industry.html', 'methodology.html', 'app.js',
            'calculator-template.js', 'providers.js', 'solar.js', 'style.css', 'roof.js', 'roof.css', 'geometry.js'];
          const expected = await Promise.all(files.map(async sourcePath => {
            const source = `https://raw.githubusercontent.com/${process.env.GITHUB_REPOSITORY}/${commit}/${sourcePath}`;
            const original = await fetch(source, { signal: AbortSignal.timeout(10000) });
            assert.ok(original.ok, `${sourcePath}: HTTP ${original.status}`);
            const published = new URL(sourcePath === 'index.html' ? '' : sourcePath, site);
            published.searchParams.set('revision', commit);
            return [published, await original.text()];
          }));

          for (let attempt = 0; attempt < 18; attempt += 1) {
            const matches = await Promise.all(expected.map(async ([published, original]) => {
              const served = await fetch(published, { signal: AbortSignal.timeout(5000) }).catch(() => null);
              return served?.ok && await served.text() === original;
            }));
            if (matches.every(Boolean)) break;
            assert.ok(attempt < 17, `Pages did not serve HTML and scripts for ${commit.slice(0, 7)}`);
            await setTimeout(5000);
          }
          const data = await fetch(new URL('data/nasa-power-climatology.json', site), { signal: AbortSignal.timeout(10000) });
          assert.ok(data.ok, `Bundled data: HTTP ${data.status}`);
          const profile = (await data.json()).cells?.['47.5,39.5'];
          assert.ok(profile?.length === 12 && profile.every(value => Number.isFinite(value) && value >= 0));

          const document = await fetch(new URL('methodology.pdf', site), { signal: AbortSignal.timeout(10000) });
          assert.ok(document.ok && (await document.text()).startsWith('%PDF-'), 'The formulas PDF is unavailable.');

          const [, model] = expected.find(([url]) => url.pathname.endsWith('/solar.js'));
          const { calculateBackup, calculateSolar } = await import(`data:text/javascript;base64,${Buffer.from(model).toString('base64')}`);
          const home = calculateSolar(profile, { lat: 47.2357, tilt: 35, azimuth: 180, panels: 13,
            bill: 5000, tariff: 6, cost: 450000 });
          const factory = calculateSolar(profile, { lat: 47.2357, tilt: 15, azimuth: 180, panels: 809,
            consumption: 90000, selfUse: 0.85, tariff: 9.5, cost: 18000000, maintenance: 250000 });
          assert.equal(Math.round(home.saving), 25291);
          assert.equal(Math.round(factory.saving), 3338576);
          assert.equal(Math.round(factory.payback * 10), 54);
          assert.equal(calculateBackup({ battery: 10, load: 0.5, charge: 100, inverter: 3 }).hours, 18);

          const [, layoutSource] = expected.find(([url]) => url.pathname.endsWith('/geometry.js'));
          const { layoutPanels, manualRect } = await import(`data:text/javascript;base64,${Buffer.from(layoutSource).toString('base64')}`);
          const roof = manualRect({ lat: 47.2357, lng: 39.7015 }, 10, 10);
          const pitched = layoutPanels(roof, { roof: 'pitched', azimuth: 180, tilt: 30, lat: 47.2357 });
          const flat = layoutPanels(roof, { roof: 'flat', lat: 47.2357 });
          assert.equal(pitched.count, 40);
          assert.equal(flat.count, 14);
          assert.equal(flat.tilt, 34);
          assert.equal(Math.round(flat.rowGap * 10), 31);
          console.log(`Pages serves ${commit.slice(0, 7)}. Both calculations match the examples based on the NASA archive.`);
          JS
      - name: Photon responds to an address search and permits browser requests
        if: always()
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          const origin = new URL(process.env.SITE_URL).origin;
          const endpoint = new URL('https://photon.komoot.io/api/');
          endpoint.search = new URLSearchParams({
            q: 'Ростов-на-Дону, Большая Садовая улица', countrycode: 'RU', limit: '5'
          });
          const reply = await fetch(endpoint, {
            headers: { Origin: origin, 'Accept-Language': 'ru-RU,ru;q=0.9,en;q=0.5' },
            signal: AbortSignal.timeout(16000)
          });
          if (!reply.ok) throw new Error(`Photon: HTTP ${reply.status}: ${(await reply.text()).slice(0, 300)}`);
          assert.ok(['*', origin].includes(reply.headers.get('access-control-allow-origin')), 'Photon did not permit the GitHub Pages origin.');
          const { features } = await reply.json();
          assert.ok(features?.some(feature => {
            const [longitude, latitude] = feature.geometry?.coordinates ?? [];
            return feature.properties?.countrycode?.toUpperCase() === 'RU'
              && Math.abs(longitude - 39.7) < 0.5 && Math.abs(latitude - 47.24) < 0.5;
          }), 'Photon did not return a Russian address near Rostov-on-Don.');
          console.log('Photon returned valid coordinates and allowed the browser origin.');
          JS
      - name: Esri World Imagery serves a satellite tile
        if: always()
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          const site = process.env.SITE_URL;
          const reply = await fetch('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/17/45968/79990', {
            headers: { Referer: site }, signal: AbortSignal.timeout(12000)
          });
          assert.ok(reply.ok, `Esri World Imagery: HTTP ${reply.status}`);
          assert.match(reply.headers.get('content-type') ?? '', /^image\//);
          console.log('Esri World Imagery returned a satellite tile of Rostov-on-Don.');
          JS
      - name: OpenStreetMap serves a tile
        if: always()
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          const site = process.env.SITE_URL;
          const reply = await fetch('https://tile.openstreetmap.org/12/2499/1436.png', {
            headers: { 'User-Agent': `Delta500SolarCalculator/1.0 (+${site})`, Referer: site },
            signal: AbortSignal.timeout(12000)
          });
          assert.ok(reply.ok, `OpenStreetMap: HTTP ${reply.status}`);
          assert.match(reply.headers.get('content-type') ?? '', /^image\/png/);
          console.log('OpenStreetMap returned a PNG tile near Rostov-on-Don.');
          JS
      - name: NASA POWER returns 12 monthly values and permits browser requests
        if: always()
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          const origin = new URL(process.env.SITE_URL).origin;
          const endpoint = new URL('https://power.larc.nasa.gov/api/temporal/climatology/point');
          endpoint.search = new URLSearchParams({
            parameters: 'ALLSKY_SFC_SW_DWN', community: 'RE', latitude: '62.5', longitude: '129.5', format: 'JSON'
          });
          const reply = await fetch(endpoint, { headers: { Origin: origin }, signal: AbortSignal.timeout(16000) });
          assert.ok(reply.ok, `NASA POWER: HTTP ${reply.status}`);
          assert.ok(['*', origin].includes(reply.headers.get('access-control-allow-origin')), 'NASA POWER did not permit the GitHub Pages origin.');
          const irradiation = (await reply.json()).properties?.parameter?.ALLSKY_SFC_SW_DWN;
          const months = 'JAN FEB MAR APR MAY JUN JUL AUG SEP OCT NOV DEC'.split(' ');
          assert.ok(months.every(month => Number.isFinite(irradiation?.[month]) && irradiation[month] >= 0));
          console.log('NASA POWER returned 12 values outside the local archive and allowed the browser origin.');
          JS
